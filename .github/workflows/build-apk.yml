name: Build My Family Doc Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK & licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            SDK_ROOT="$HOME/android-sdk"
            mkdir -p "$SDK_ROOT"
          fi
          if [ ! -w "$SDK_ROOT" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$SDK_ROOT" || true
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$SDK_ROOT/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$SDK_ROOT/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK_ROOT/licenses/android-sdk-preview-license"
          SDK_MGR="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          if [ -n "$SDK_MGR" ] && [ -x "$SDK_MGR" ]; then
            echo "Using sdkmanager: $SDK_MGR"
            yes | "$SDK_MGR" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
            "$SDK_MGR" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" || true
          else
            echo "Using preinstalled Android SDK at $SDK_ROOT"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug.keystore securely
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            echo "$DEBUG_KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > debug.keystore
            echo "Prepared debug.keystore from GitHub Secret."
          elif [ -f debug.keystore ]; then
            echo "Using existing debug.keystore."
          elif [ -f debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
            echo "Prepared debug.keystore from debug.keystore.base64."
          else
            echo "Generating fallback Android debug keystore..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -lh debug.keystore
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1:|SHA256:" || true
          APK_SHA1="$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey 2>/dev/null | sed -n 's/.*SHA1: //p' | head -n 1)"
          echo "APK_SHA1=${APK_SHA1:-unknown}" >> "$GITHUB_ENV"

      - name: Prepare app/google-services.json securely
        env:
          GOOGLE_SERVICES_RAW: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -f app/google-services.json ]; then
            echo "Using app/google-services.json from repository."
          elif [ -n "$GOOGLE_SERVICES_RAW" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_RAW" > app/google-services.json
            echo "Prepared app/google-services.json from GOOGLE_SERVICES_JSON secret."
          elif [ -n "$GOOGLE_SERVICES_B64" ]; then
            echo "$GOOGLE_SERVICES_B64" | tr -d '\r\n ' | base64 -d > app/google-services.json
            echo "Prepared app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret."
          else
            echo "::error::app/google-services.json is missing! AI Studio excludes it on Push to GitHub. Add the contents of app/google-services.json as a GitHub Repository Secret named GOOGLE_SERVICES_JSON."
            exit 1
          fi

      - name: Build Debug APK
        run: |
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew
            ./gradlew :app:assembleDebug --stacktrace --console=plain
          else
            echo "Wrapper jar not present; building with setup-gradle 9.3.1..."
            gradle :app:assembleDebug --stacktrace --console=plain
          fi

      - name: Stage APK in artifacts folder
        if: success()
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/app-debug.apk
          if [ -f app/build/outputs/apk/debug/output-metadata.json ]; then
            cp app/build/outputs/apk/debug/output-metadata.json artifacts/output-metadata.json
          fi
          ls -lh artifacts/

      - name: Upload Debug APK to GitHub Actions Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: app/build/outputs/logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish latest Debug APK to GitHub Release
        id: publish_release
        if: success()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: My Family Doc Debug APK (Latest)
          body: |
            Latest automated Debug APK build for **My Family Doc** (`com.aistudio.myfamilydoc.k7m2px`).

            - **Direct APK Download:** `${{ github.server_url }}/${{ github.repository }}/releases/download/debug-latest/app-debug.apk`
            - **Build #:** `${{ github.run_number }}`
            - **Commit:** `${{ github.sha }}`
          files: artifacts/app-debug.apk
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write direct download links to workflow summary
        if: success()
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## My Family Doc — Debug APK Ready

          - **Actions Artifact (`app-debug-apk`):** [Download from this Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          - **Direct APK Link (Latest Release):** ${{ github.server_url }}/${{ github.repository }}/releases/download/debug-latest/app-debug.apk
          - **Release Page:** ${{ github.server_url }}/${{ github.repository }}/releases/tag/debug-latest
          - **APK Signing SHA-1 (Register in Firebase Console if Google Sign-In fails):** `${{ env.APK_SHA1 }}`
          EOF
